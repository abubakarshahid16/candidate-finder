name: candidate-finder-local

services:
  api:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-c", "pip install --no-cache-dir -r infra/fastapi/requirements.txt && uvicorn infra.fastapi.main:app --host 0.0.0.0 --port 3001"]
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  worker:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-c", "pip install --no-cache-dir fastapi==0.115.12 uvicorn==0.34.0 && uvicorn infra.fastapi.worker:app --host 0.0.0.0 --port 3002"]
    ports:
      - "${WORKER_PORT:-3002}:3002"
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
